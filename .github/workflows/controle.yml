name: Controle toolkit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Links, downloads, inhoud en metadata controleren
        run: python3 scripts/check-toolkit.py
      - name: Publicatiebeveiliging controleren
        run: python3 scripts/test-publish-toolkit.py

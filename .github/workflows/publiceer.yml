name: Publiceren naar eigen domein

# uvnl-brandbook/vooruitblik is de bron; de doelrepo is uitsluitend de publicatie.
# Bewaar historie en stop als iemand de gepubliceerde versie rechtstreeks heeft aangepast.
on:
  push:
    branches: [main]
    paths:
      - "vooruitblik/**"
      - "404.html"
      - ".github/workflows/publiceer.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publiceren
  cancel-in-progress: false
jobs:
  publiceer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Publiceren met controle op rechtstreekse wijzigingen
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_VOORUITBLIK }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:mennoes/vooruitblik.git "$RUNNER_TEMP/publicatie"
          python3 scripts/publish-toolkit.py "$RUNNER_TEMP/publicatie"
          cd "$RUNNER_TEMP/publicatie"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="publiceren" -c user.email="noreply@github.com" commit -m "Publicatie van ${GITHUB_SHA::7}"
          # Geen force-push: een gelijktijdige wijziging moet de publicatie stoppen.
          git push origin HEAD:main
